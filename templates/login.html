<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCB Inspection Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        :root {
            /* Circuit Colors */
            --circuit-bg: #001214;
            --circuit-trace: #00ffff;
            --circuit-glow: rgba(0, 255, 255, 0.5);
            --circuit-node: #00ffff;
            
            /* Form Colors */
            --form-bg: rgba(255, 255, 255, 0.95);
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: rgba(0, 255, 255, 0.3);
            --input-focus: #00ffff;
            --button-bg: #00ffff;
            --button-hover: #00cccc;
            --text-dark: #001214;
            --text-light: #666;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }
        
        body {
            background: var(--circuit-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Circuit Board Animation */
        .circuit-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .circuit-path {
            stroke: var(--circuit-trace);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            filter: drop-shadow(0 0 5px var(--circuit-glow));
            animation: drawPath 8s linear infinite;
        }
        
        .circuit-node {
            fill: var(--circuit-node);
            r: 3;
            filter: drop-shadow(0 0 8px var(--circuit-glow));
            animation: pulseNode 3s ease-in-out infinite;
        }
        
        @keyframes drawPath {
            0% {
                stroke-dashoffset: 1000;
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                stroke-dashoffset: 0;
                opacity: 0;
            }
        }
        
        @keyframes pulseNode {
            0%, 100% {
                r: 2;
                opacity: 0.5;
                filter: drop-shadow(0 0 5px var(--circuit-glow));
            }
            50% {
                r: 4;
                opacity: 1;
                filter: drop-shadow(0 0 15px var(--circuit-glow));
            }
        }
        
        /* Login Container */
        .login-container {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        /* Login Form */
        .login-form-container {
            width: 100%;
            max-width: 400px;
            background: var(--form-bg);
            border-radius: 15px;
            box-shadow: 0 0 30px var(--circuit-glow);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transform: translateY(0);
            transition: all 0.5s ease;
            animation: formAppear 1s ease-out forwards;
        }
        
        @keyframes formAppear {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-form-container:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 40px var(--circuit-glow);
        }
        
        .login-form {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 30px;
            background: var(--circuit-bg);
            border: 2px solid #f00;
           
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--circuit-glow);
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--circuit-glow);
        }
        
        .logo img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(1);
        }
        
        .input-field {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }
        
        .input-field input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-dark);
            background: var(--input-bg);
            transition: all 0.3s ease;
        }
        
        .input-field input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--circuit-glow);
            outline: none;
        }
        
        .input-field input::placeholder {
            color: var(--text-light);
        }
        
        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: var(--button-bg);
            color: var(--circuit-bg);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--circuit-glow);
        }
        
        .login-button:hover {
            background: #c00;
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
          }
        
        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 0 15px var(--circuit-glow);
        }
        
        /* Footer */
        .footer-text {
            margin-top: 30px;
            font-size: 30px;
            color: #f00;
           
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--circuit-glow);
            animation: fadeIn 2s ease-out forwards;
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        
        /* Alert Popup */
        .alert-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: var(--circuit-bg);
            color: var(--circuit-trace);
            border: 1px solid var(--circuit-trace);
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 0 20px var(--circuit-glow);
            z-index: 1000;
            display: none;
            animation: slideIn 0.5s ease-out forwards;
        }
        
        @keyframes slideIn {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .login-form {
                padding: 30px 20px;
            }
            
            .logo {
                width: 70px;
                height: 70px;
            }
            
            .logo img {
                width: 35px;
                height: 35px;
            }
            
            .input-field input {
                padding: 12px 15px;
                font-size: 14px;
            }
            
            .login-button {
                padding: 12px;
                font-size: 14px;
            }
            
            .footer-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Circuit Board Animation -->
    <div class="circuit-background">
        <svg width="100%" height="100%" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <!-- Main horizontal traces -->
            <path class="circuit-path" d="M0,100 L200,100 L250,150 L400,150 L450,100 L1000,100" style="animation-delay: 0s"></path>
            <path class="circuit-path" d="M0,300 L300,300 L350,350 L500,350 L550,300 L1000,300" style="animation-delay: 1s"></path>
            <path class="circuit-path" d="M0,500 L400,500 L450,550 L600,550 L650,500 L1000,500" style="animation-delay: 2s"></path>
            <path class="circuit-path" d="M0,700 L500,700 L550,750 L700,750 L750,700 L1000,700" style="animation-delay: 3s"></path>
            <path class="circuit-path" d="M0,900 L600,900 L650,850 L800,850 L850,900 L1000,900" style="animation-delay: 4s"></path>
            
            <!-- Main vertical traces -->
            <path class="circuit-path" d="M200,0 L200,1000" style="animation-delay: 0.5s"></path>
            <path class="circuit-path" d="M400,0 L400,1000" style="animation-delay: 1.5s"></path>
            <path class="circuit-path" d="M600,0 L600,1000" style="animation-delay: 2.5s"></path>
            <path class="circuit-path" d="M800,0 L800,1000" style="animation-delay: 3.5s"></path>
            
            <!-- Complex routing patterns -->
            <path class="circuit-path" d="M250,150 L250,250 L350,350" style="animation-delay: 4.5s"></path>
            <path class="circuit-path" d="M450,350 L450,450 L550,550" style="animation-delay: 5s"></path>
            <path class="circuit-path" d="M650,550 L650,650 L750,750" style="animation-delay: 5.5s"></path>
            
            <!-- IC-like patterns -->
            <path class="circuit-path" d="M300,200 L300,400 L500,400 L500,200 Z" style="animation-delay: 6s"></path>
            <path class="circuit-path" d="M600,600 L600,800 L800,800 L800,600 Z" style="animation-delay: 6.5s"></path>
            
            <!-- Connection nodes -->
            <circle class="circuit-node" cx="200" cy="100"></circle>
            <circle class="circuit-node" cx="400" cy="150"></circle>
            <circle class="circuit-node" cx="600" cy="300"></circle>
            <circle class="circuit-node" cx="800" cy="500"></circle>
            <circle class="circuit-node" cx="300" cy="700"></circle>
            <circle class="circuit-node" cx="500" cy="900"></circle>
            
            <!-- Additional nodes with different animation delays -->
            <circle class="circuit-node" cx="250" cy="150" style="animation-delay: 0.5s"></circle>
            <circle class="circuit-node" cx="450" cy="350" style="animation-delay: 1s"></circle>
            <circle class="circuit-node" cx="650" cy="550" style="animation-delay: 1.5s"></circle>
            <circle class="circuit-node" cx="850" cy="750" style="animation-delay: 2s"></circle>
        </svg>
    </div>

    <div class="login-container">
        <div class="login-form-container">
            <form method="post" action="/login" class="login-form">
                <div class="logo">
                    <img src="/static/images/Vector.svg" alt="Logo" />
                </div>
                
                <div class="input-field">
                    <input type="text" required placeholder="Username" name="username" />
                </div>
                
                <div class="input-field">
                    <input type="password" required placeholder="Password" name="password" />
                </div>
                
                <button type="submit" class="login-button">Login</button>
            </form>
        </div>
        
        <h4 class="footer-text"></h4>
    </div>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert-popup" id="alert-popup">
            {{ messages[0] }}
        </div>
        <script>
            $(document).ready(function() {
                $('#alert-popup').fadeIn().delay(3000).fadeOut();
            });
        </script>
      {% endif %}
    {% endwith %}
    
    <script>
        // Create dynamic circuit paths
        function createDynamicCircuits() {
            const container = document.querySelector('.circuit-background svg');
            const viewBox = container.getAttribute('viewBox').split(' ');
            const maxWidth = parseInt(viewBox[2]);
            const maxHeight = parseInt(viewBox[3]);
            
            // Create a new circuit path every 4 seconds
            setInterval(() => {
                const startX = Math.floor(Math.random() * maxWidth);
                const startY = Math.floor(Math.random() * maxHeight);
                
                let pathData = `M${startX},${startY} `;
                let currentX = startX;
                let currentY = startY;
                
                // Create PCB-like path with 45-degree angles
                const segments = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < segments; i++) {
                    if (Math.random() > 0.5) {
                        // Horizontal with 45-degree transition
                        const transitionX = currentX + (Math.random() > 0.5 ? 50 : -50);
                        const newX = transitionX + (Math.random() > 0.5 ? 100 : -100);
                        pathData += `L${transitionX},${currentY} L${newX},${currentY} `;
                        currentX = newX;
                    } else {
                        // Vertical with 45-degree transition
                        const transitionY = currentY + (Math.random() > 0.5 ? 50 : -50);
                        const newY = transitionY + (Math.random() > 0.5 ? 100 : -100);
                        pathData += `L${currentX},${transitionY} L${currentX},${newY} `;
                        currentY = newY;
                    }
                }
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('class', 'circuit-path');
                path.setAttribute('d', pathData);
                container.appendChild(path);
                
                // Remove after animation
                setTimeout(() => {
                    if (path.parentNode) {
                        path.parentNode.removeChild(path);
                    }
                }, 8000);
            }, 4000);
            
            // Create glowing nodes every 2 seconds
            setInterval(() => {
                const x = Math.floor(Math.random() * maxWidth);
                const y = Math.floor(Math.random() * maxHeight);
                
                const node = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                node.setAttribute('class', 'circuit-node');
                node.setAttribute('cx', x);
                node.setAttribute('cy', y);
                container.appendChild(node);
                
                // Remove after animation
                setTimeout(() => {
                    if (node.parentNode) {
                        node.parentNode.removeChild(node);
                    }
                }, 3000);
            }, 2000);
        }

        // Start dynamic circuit creation after page loads
        window.addEventListener('load', createDynamicCircuits);
    </script>
</body>
</html>
