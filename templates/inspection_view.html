<script>
  async function downloadImage() {
      const imgElement = document.getElementById("staticImage");
  
      if (!imgElement || !imgElement.src) {
          alert("No image found!");
          return;
      }
      
  
      try {
          // Ask user for defect details
          const defectType = prompt("Enter defect type (e.g., Component: R24, Component: R26, Component: R22):", "Component: R21");
          if (!defectType) return alert("Defect type is required!");
  
          const confidence = prompt("Enter confidence level (0.0 - 1.0):", "0.95");
          if (!confidence || isNaN(confidence) || confidence < 0 || confidence > 1) {
              return alert("confidence value! Enter a number between 0.0 and 1.0.");
          }
  
          const remarks = prompt("Enter remarks (optional):", "like wrong detection etc");
  
          // Convert image to Base64
          const response = await fetch(imgElement.src);
          const blob = await response.blob();
  
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = async function () {
              const base64Data = reader.result;
  
              // Send to backend
              const result = await fetch("/save-image", {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                      imageData: base64Data,
                      defectType: defectType,
                      confidence: parseFloat(confidence),
                      remarks: remarks,
                  }),
              });
  
              const data = await result.json();
              alert(data.message || "Error occurred");
          };
      } catch (error) {
          console.error("Error downloading image:", error);
      }
  }
  </script>
<script>
  // Function to continuously check the status every second
  function checkStatus() {
      fetch('/status')
          .then(response => response.json())
          .then(data => {
              const alignStatus = data.allign_status;
              const isSteamActive = data.is_steam_active;
              const popup = document.getElementById('popup');
              const startInspectionButton = document.getElementById('start-inspection');
              const startSteamButton = document.getElementById('start-steam');
              const staticImage = document.getElementById('staticImage');
              const videoElement = document.getElementById('video');
              const imageDisplay = document.getElementById('image-display');
              const detectionView = document.querySelector('.detection-view');
              const group7 = document.querySelector('.group-7');

              // Handle the alignment status
              if (alignStatus === false) {
                  startInspectionButton.disabled = true;  // Disable the button
                  startInspectionButton.style.backgroundColor = 'red';  // Set to red
              } else if (alignStatus === true) {
                  startInspectionButton.disabled = false;  // Enable the button
                  startInspectionButton.style.backgroundColor = 'green';  // Set to green
              }

              // Handle the start steam button: enable/disable based on is_steam_active
              if (isSteamActive === false) {
                  startSteamButton.disabled = true;  // Disable the button
                  startSteamButton.style.backgroundColor = 'red';  // Set to red
              } else if (isSteamActive === true) {
                  startSteamButton.disabled = false;  // Enable the button
                  startSteamButton.style.backgroundColor = 'green';  // Set to green
              }

              // Show Steam Video when Steam is activated
              if (isSteamActive === true) {
                  staticImage.style.display = 'none';  // Hide the static image
                  videoElement.style.display = 'block'; // Show the video stream
                  videoElement.play();  // Start the video
                  imageDisplay.style.display = 'none'; // Hide the image display
                  detectionView.textContent = 'Steam Mode'; // Change detection view text
                  group7.style.backgroundColor = '#f0f0f0'; // Adjust background color for steam mode
              }

              // Automatically check status every second
          })
          .catch(error => console.error('Error fetching status:', error));
  }

  // Handle start inspection button click
  document.getElementById('start-inspection').addEventListener('click', function() {
      alert('Starting Inspection...');
      const steamContainer = document.getElementById('steam-container');
      const staticImage = document.getElementById('staticImage');
      const videoElement = document.getElementById('video');
      const imageDisplay = document.getElementById('image-display');
      const detectionView = document.querySelector('.detection-view');
      const group7 = document.querySelector('.group-7');

      // Switch to Inspection View (show static image and stop the video)
      staticImage.style.display = 'block'; // Show the static image
      videoElement.style.display = 'none'; // Hide the video stream
      imageDisplay.style.display = 'block'; // Show the image display
      detectionView.textContent = 'Detection View'; // Reset text for inspection mode
      group7.style.backgroundColor = ''; // Reset background color to default
      videoElement.pause(); // Pause the video if it was playing

      // Trigger the inspection route
      fetch('/start_inspection')
          .then(response => response.json())
          .then(data => {
              console.log("Inspection started!");
          });
  });

  // Handle start steam button click
  document.getElementById('start-steam').addEventListener('click', function() {
      fetch('/start-steam')  // You'll need to handle this route in Flask
          .then(response => response.json())
          .then(data => {
              console.log('Steam started');
              // Logic to show steam video and remove steam button can go here
              const videoElement = document.getElementById('video');
              const staticImage = document.getElementById('staticImage');
              const imageDisplay = document.getElementById('image-display');
              const detectionView = document.querySelector('.detection-view');
              const group7 = document.querySelector('.group-7');

              // Switch to Steam Mode (show the video and hide the image)
              staticImage.style.display = 'none';
              videoElement.style.display = 'block';
              imageDisplay.style.display = 'none';
              videoElement.play();  // Start the video stream
              detectionView.textContent = 'Steam Mode'; // Change the view label
              group7.style.backgroundColor = '#f0f0f0'; // Change background for steam mode
          });
  });

  // Continuously check status every 1 second (setInterval will do this)
  setInterval(checkStatus, 1000);
</script>

<script>
  let PCB = "PCB_0";

  document.addEventListener("DOMContentLoaded", function () {
    fetchDefectData(PCB);

  });

  async function fetchDefectData(pcb) {
    try {
      const response = await fetch(`http://127.0.0.1:5000/results/Panel_1/${pcb}/defects.json`);
      const data = await response.json();
      console.log('Fetched defect data:', data);
      displayDefectData(data);
    } catch (error) {
      console.error('Error fetching defect data:', error);
    }
  }

  function displayDefectData(data) {
    const defectMapping = {
      "wrong_Values": "Wrong_Values",
      "Capacitor_Color": "Capacitor_ColorPoints",
      "Bridge": "bridgingShortPoints",
      "IC_Direction": "wrongPolarityPoints",
      "missing": "missingComponentPoints",
      "Shifted": "ShiftedComponentsPoints",
      "Dry_Solder": "DrySolderComponent"
    };

    data.defects.forEach(defect => {
      const type = defect.defect_type;
      const count = defect.count;
      const pointsElementId = defectMapping[type];
      const element = document.getElementById(pointsElementId);

      if (element) {
        element.innerText = count;
      }
    });
  }

  function showDefectImages(defectType) {
    const imageContainer = document.getElementById('imageContainer');
    const staticImage = document.getElementById('staticImage');
    const imageDisplay = document.getElementById('image-display');

    if (staticImage) {
      staticImage.src = '';
      console.log("Old static image cleared.");
    }

    if (imageDisplay) {
      imageDisplay.innerHTML = '';
      imageDisplay.style.display = 'none';
      console.log("Image display div cleared and hidden.");
    }

    fetch(`http://127.0.0.1:5000/results/Panel_1/${PCB}/defects.json`)
      .then(response => response.json())
      .then(data => {
        const defect = data.defects.find(d => d.defect_type === defectType);

        if (defect && defect.data.length > 0) {
          imageContainer.innerHTML = '';
          defect.data.forEach(item => {
            const imageWrapper = document.createElement('div');
            imageWrapper.classList.add('image-wrapper');

            const image = document.createElement('img');
            image.src = `data:image/jpeg;base64,${item.image}`;
            image.alt = `Component: ${item.Component}`;
            image.classList.add('defectImage');
            imageWrapper.appendChild(image);

            const componentName = document.createElement('div');
            componentName.classList.add('component-name');
            componentName.innerText = `Component: ${item.Component}`;
            imageWrapper.appendChild(componentName);

            imageContainer.appendChild(imageWrapper);

            image.addEventListener('click', () => {
              if (staticImage) {
                staticImage.src = image.src;
                console.log("Static image updated with new one.");
              }

              if (imageDisplay) {
                imageDisplay.innerHTML = '';
                imageDisplay.style.display = 'none';
                console.log("Image display div cleared and hidden after clicking an image.");
              }
            });
          });

          imageContainer.style.display = 'flex';
        } else {
          imageContainer.style.display = 'none';
        }
      })
      .catch(error => {
        console.error('Error fetching defect data for images:', error);
        imageContainer.style.display = 'none';
      });
  }

  async function fetchDetailData(pcb) {
    try {
      const response = await fetch(`http://127.0.0.1:5000/results/Panel_1/${pcb}/details.json`);
      const data = await response.json();
      console.log('Fetched detail data:', data);
      updateContent(data);
      updateDefectStatus(data.defectFound, data.checklistItem);
    } catch (error) {
      console.error('Error fetching detail data:', error);
    }
  }

  function updateContent(data) {
    document.getElementById("checklist-item").textContent = `Defect in ${data.checklistItem}`;
    document.getElementById("points").textContent = data.points;
    document.getElementById("checked-items").textContent = data.checkedItems;
    document.getElementById("total-items").textContent = data.totalItems;
    document.getElementById("defect-name").textContent = data.defectFound;
    document.getElementById("time-taken").textContent = data.timeTaken;
  }

  function updateDefectStatus(defectFound, checklistItem) {
    const indicator = document.getElementById('defect-indicator');
    const checklistItemElement = document.getElementById('checklist-item');
    const defectUidk = document.getElementById('defect-uidk');
    const rectangle = document.getElementById('rectangle');

    if (defectFound && defectFound !== "") {
      indicator.style.backgroundColor = "red";
      checklistItemElement.style.backgroundColor = "red";
      checklistItemElement.style.color = "white";
      defectUidk.textContent = "Defect Found";
      rectangle.style.backgroundColor = "#fe1a3d";
      checklistItemElement.textContent = `Defect in ${checklistItem}`;
    } else {
      indicator.style.backgroundColor = "green";
      checklistItemElement.style.backgroundColor = "green";
      checklistItemElement.style.color = "white";
      defectUidk.textContent = "No Defect";
      rectangle.style.backgroundColor = "green";
      checklistItemElement.textContent = "No Defect";
    }
  }

  const imagePaths = [
  "{{ url_for('static', filename='test/IMG_6370.JPG') }}",
];

   let pcbPanels = [];

// Initialize UI components
const container = document.getElementById('pcb-panel-container');
const imageDisplay = document.getElementById('image-display');
const staticImage = document.getElementById('staticImage');

// Fetch defect data from Flask server
async function fetchPCBData() {
  try {
    const response = await fetch('/get_defects');
    const data = await response.json();
    console.log('Fetched defect data:', data);

    const pcbCount = parseInt(data.PCB.split('_')[1], 10); // Extract PCB count
    updatePCBPanels(pcbCount);
  } catch (error) {
    console.error('Error fetching defect data:', error);
  }
}

// Update pcbPanels array with serial numbers
function updatePCBPanels(count) {
  pcbPanels = [];
  for (let i = 1; i <= count; i++) {
    pcbPanels.push({
      serialNumber: i.toString(),
      imagePath: imagePaths[0],
      className: "defect-uidk-23"
    });
  }

  // Re-render the container with the updated panels
  renderPCBPanels();
}

// Render PCB panels
function renderPCBPanels() {
  container.innerHTML = ''; // Clear existing content

  pcbPanels.forEach((panel, index) => {
    const frame = document.createElement('div');
    frame.className = 'frame-1d';

    const innerFrame = document.createElement('div');
    innerFrame.className = 'frame-1e';

    const serialSpan = document.createElement('span');
    serialSpan.className = panel.className;
    serialSpan.textContent = `PCB-${panel.serialNumber}`;

    innerFrame.appendChild(serialSpan);
    frame.appendChild(innerFrame);
    container.appendChild(frame);

    frame.addEventListener('click', () => {
      sessionStorage.setItem('imagesDisplayed', index + 1);
      location.reload();
    });
  });
}

// Display images for the given count
function displayImages(count) {
  setPCBValue(count);
  imageDisplay.innerHTML = '';

  if (staticImage) {
    staticImage.src = '';
  }

  pcbPanels.slice(0, count).forEach(panel => {
    const img = document.createElement('img');
    img.src = panel.imagePath;
    img.alt = `PCB ${panel.serialNumber} image`;
    img.className = 'pcb-image';
    imageDisplay.appendChild(img);
  });
}

// Set the PCB value for further operations
function setPCBValue(count) {
  PCB = `PCB_${count}`;
  console.log(`PCB value set to ${PCB}`);
  fetchDefectData(PCB); // Assumes fetchDefectData function is defined elsewhere
  fetchDetailData(PCB); // Assumes fetchDetailData function is defined elsewhere
}

// Periodically fetch PCB data every 10 seconds
setInterval(fetchPCBData, 10000);

// Initial fetch on page load
window.addEventListener('load', () => {
  fetchPCBData();

  // Handle stored session data for image display
  const count = sessionStorage.getItem('imagesDisplayed');
  if (count) {
    displayImages(parseInt(count, 10));
    sessionStorage.removeItem('imagesDisplayed');
  }
});
